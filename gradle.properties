org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# IronAPP VPN cores: set to true locally once the matching SDK/AAR is present.
# CI builds keep them false and use the ExternalApp handoff so every ABI stays green.
ironapp.wireguardEmbedded=true
