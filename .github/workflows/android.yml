name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SINGBOX_VERSION: "1.14.2"
  GO_VERSION: "1.25.5"
  SINGBOX_TAGS: "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0"

jobs:
  # ---- Build the sing-box mobile core (libbox.aar) from pinned source ----
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # sing-box v1.14.2 linknames Go 1.25 runtime internals: NEVER let the
      # toolchain auto-upgrade (fail fast instead of corrupt .so files).
      GOTOOLCHAIN: local
      GOFLAGS: -mod=mod
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform + NDK for gomobile)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.0.13004108

      - name: Cache Go modules + gomobile NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/gomobile
          key: ironapp-core-${{ env.SINGBOX_VERSION }}-${{ env.GO_VERSION }}-v1
          restore-keys: ironapp-core-

      - name: Fetch sing-box source
        run: |
          git clone --depth 1 --branch v${{ env.SINGBOX_VERSION }} https://github.com/SagerNet/sing-box.git sing-box-src
          test -f sing-box-src/experimental/libbox/platform.go

      - name: Install gomobile (pinned to Go 1.25 era)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Resolve the newest x/mobile that still builds with Go 1.25
          # (newer ones require go >= 1.26 and break sing-box linknames).
          XMOBILE_VER=""
          for v in $(go list -m -versions golang.org/x/mobile | tr ' ' '\n' | grep -E '^v0\.0\.0-' | sort -r); do
            if go install "golang.org/x/mobile/cmd/gomobile@$v" 2>/dev/null; then
              XMOBILE_VER="$v"
              echo "gomobile $v selected"
              break
            fi
          done
          test -n "$XMOBILE_VER" || (echo "no go1.25-compatible gomobile found" && exit 1)
          echo "XMOBILE_VER=$XMOBILE_VER" >> "$GITHUB_ENV"
          gomobile init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Bind libbox.aar (all Android ABIs, android-21+)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/28.0.13004108}"
          # Bind from INSIDE the sing-box module (its own go.mod gains x/mobile),
          # so package paths and internal/ visibility stay canonical.
          cd sing-box-src
          go get "golang.org/x/mobile/cmd/gomobile@$XMOBILE_VER"
          go get -tool "golang.org/x/mobile/cmd/gobind@$XMOBILE_VER"
          go mod tidy
          gomobile bind -v -o "$GITHUB_WORKSPACE/libbox.aar" \
            -target=android -androidapi 21 \
            -javapkg com.ironpanel.libbox \
            -tags "$SINGBOX_TAGS" \
            ./experimental/libbox

      - name: Verify AAR ABIs
        run: |
          unzip -l libbox.aar | grep -E "jni/(arm64-v8a|armeabi-v7a|x86|x86_64)/libgojni.so"

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox.aar
          if-no-files-found: error

  # ---- Build universal + per-ABI release APKs ----
  build:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download libbox.aar into app/libs
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create CI debug keystore (release key via Secrets when provided)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass android -keypass android \
              -dname "CN=IronAPP CI, OU=CI, O=IronAPP, C=US"
          fi

      - name: Build universal + per-ABI release APKs
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          IRONAPP_KEYSTORE_PATH: ${{ secrets.IRONAPP_KEYSTORE_PATH }}
          IRONAPP_KEYSTORE_PASSWORD: ${{ secrets.IRONAPP_KEYSTORE_PASSWORD }}
          IRONAPP_KEY_ALIAS: ${{ secrets.IRONAPP_KEY_ALIAS }}
          IRONAPP_KEY_PASSWORD: ${{ secrets.IRONAPP_KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ironapp-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ironapp-apks
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
